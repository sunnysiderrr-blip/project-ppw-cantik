<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Satwika | Paket yang Tersedia</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --dark: #071739;
            --steel: #4B6382;
            --soft: #A4B5C4;
            --light: #CDD5DB;
            --accent: #A68868;
            --cream: #E3C39D;
            --white: #f9f8f4;
            --glass-bg: rgba(255, 255, 255, 0.08);
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: var(--dark) !important; 
            background: linear-gradient(135deg, var(--dark), var(--steel)) no-repeat fixed !important;
            min-height: 100vh;
            color: var(--white);
            overflow-x: hidden;
            position: relative;
        }

        .background-blur {
            position: fixed;
            width: 600px;
            height: 600px;
            background: var(--cream);
            border-radius: 50%;
            filter: blur(180px);
            opacity: 0.15;
            top: -150px;
            left: -150px;
            z-index: -1;
            animation: float 10s infinite alternate ease-in-out;
        }

        .background-blur-2 {
            position: fixed;
            width: 500px;
            height: 500px;
            background: var(--accent);
            border-radius: 50%;
            filter: blur(150px);
            opacity: 0.15;
            bottom: -100px;
            right: -100px;
            z-index: -1;
            animation: float 12s infinite alternate-reverse ease-in-out;
        }

        @keyframes float {
            0% { transform: translate(0, 0); }
            100% { transform: translate(50px, 50px); }
        }

        .site-header {
            position: sticky;
            top: 0;
            z-index: 50;
            backdrop-filter: blur(14px);
            background: rgba(7, 23, 57, 0.85);
            border-bottom: 1px solid var(--glass-border);
            padding: 1rem 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand {
            font-size: 1.45rem;
            font-weight: 700;
            color: var(--cream);
            text-decoration: none;
            letter-spacing: 2px;
        }

        .header-nav a {
            color: var(--white);
            text-decoration: none;
            margin-left: 20px;
            font-size: 0.9rem;
            transition: color 0.3s;
        }

        .header-nav a:hover {
            color: var(--accent);
        }

        .page-container {
            padding: 80px 5% 100px;
            text-align: center;
        }

        .page-title {
            font-size: 3rem;
            margin-bottom: 15px;
            background: linear-gradient(to right, var(--cream), var(--white));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .page-subtitle {
            color: var(--light);
            max-width: 600px;
            margin: 0 auto 60px;
            line-height: 1.6;
        }

        .packages-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
            perspective: 1000px;
        }

        .package-card {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 25px;
            padding: 30px;
            backdrop-filter: blur(12px);
            text-align: left;
            transition: transform 0.1s ease-out, box-shadow 0.3s;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transform-style: preserve-3d;
        }

        .package-card:hover {
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
            border-color: rgba(227, 195, 157, 0.3);
        }

        .pax-badge {
            position: absolute;
            top: 25px;
            right: 25px;
            background: rgba(166, 136, 104, 0.2);
            color: var(--cream);
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            border: 1px solid rgba(227, 195, 157, 0.3);
        }

        .card-icon {
            font-size: 2.5rem;
            color: var(--accent);
            margin-bottom: 20px;
        }

        .package-card h3 {
            font-size: 1.8rem;
            margin-bottom: 10px;
            color: var(--white);
        }

        .package-card p {
            color: var(--soft);
            font-size: 0.95rem;
            margin-bottom: 25px;
            line-height: 1.6;
            min-height: 65px;
        }

        .btn-detail {
            display: inline-block;
            padding: 10px 25px;
            background: transparent;
            color: var(--cream);
            border: 1px solid var(--cream);
            border-radius: 12px;
            text-decoration: none;
            font-weight: 500;
            transition: all 0.3s;
            width: 100%;
            text-align: center;
        }

        .package-card:hover .btn-detail {
            background: var(--cream);
            color: var(--dark);
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(7, 23, 57, 0.9);
            backdrop-filter: blur(8px);
            z-index: 100;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            visibility: hidden;
            transition: all 0.4s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .modal-content {
            background: linear-gradient(145deg, #162a4d, var(--dark));
            border: 1px solid var(--glass-border);
            width: 90%;
            max-width: 800px;
            border-radius: 30px;
            padding: 40px;
            position: relative;
            transform: translateY(50px) scale(0.9);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
            color: var(--white);
        }

        .modal-overlay.active .modal-content {
            transform: translateY(0) scale(1);
        }

        .close-modal {
            position: absolute;
            top: 25px;
            right: 30px;
            font-size: 1.5rem;
            color: var(--light);
            cursor: pointer;
            transition: color 0.3s;
        }

        .modal-header h2 { color: var(--cream); }

        .list-section h4 { color: var(--accent); margin-bottom: 15px; }

        .modal-ul { list-style: none; margin-bottom: 25px; }

        .modal-ul li {
            margin-bottom: 12px;
            color: var(--light);
            display: flex;
            align-items: flex-start;
            gap: 10px;
        }

        .modal-ul li i { color: var(--cream); margin-top: 4px; }

        .btn-book {
            padding: 15px 35px;
            background: linear-gradient(135deg, var(--accent), var(--cream));
            color: var(--dark);
            border: none;
            border-radius: 15px;
            font-weight: 700;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            transition: 0.3s;
        }

        @media (max-width: 768px) {
            .modal-body { display: block; }
            .page-title { font-size: 2.2rem; }
        }
    </style>
</head>
<body>

    <div class="background-blur"></div>
    <div class="background-blur-2"></div>

    <header class="site-header">
        <a href="index.html" class="brand">SATWIKA</a>
        <nav class="header-nav">
            <a href="index.html">Beranda</a>
            <a href="paket.html" style="color: var(--cream); font-weight: 600;">Paket</a>
            <a href="bookingSatwika.html">Booking</a>
        </nav>
    </header>

    <div class="page-container">
        <h1 class="page-title">Pilihan Paket Satwika</h1>
        <p class="page-subtitle">Sajian autentik Nusantara yang dirancang khusus untuk menyempurnakan setiap momen berharga Anda.</p>

        <div class="packages-grid" id="packagesGrid"></div>
    </div>

    <div class="modal-overlay" id="packageModal">
        <div class="modal-content">
            <i class="fa-solid fa-xmark close-modal" id="closeModal"></i>
            
            <div class="modal-header">
                <h2 id="modalTitle">Nama Paket</h2>
                <p id="modalPax" style="color: var(--soft); margin-top: 5px;">Untuk X Orang</p>
            </div>

            <div class="modal-body" style="display: grid; grid-template-columns: 1fr 1fr; gap: 30px; margin-top: 20px;">
                <div class="list-section">
                    <h4><i class="fa-solid fa-bell-concierge"></i> Layanan</h4>
                    <ul class="modal-ul" id="modalServices"></ul>
                </div>
                <div class="list-section">
                    <h4><i class="fa-solid fa-users"></i> Cocok Untuk</h4>
                    <ul class="modal-ul" id="modalSuitable"></ul>
                    
                    <div id="modalBonusSection" style="display: none; margin-top: 25px;">
                        <h4><i class="fa-solid fa-gift"></i> Bonus</h4>
                        <ul class="modal-ul" id="modalBonus"></ul>
                    </div>
                </div>
            </div>

            <div class="modal-footer" style="text-align: right; margin-top: 30px;">
                <a href="bookingSatwika.html" class="btn-book">Reservasi Paket Ini</a>
            </div>
        </div>
    </div>

    <script>
        const packagesData = [
            {
                id: 'wanci',
                name: 'Paket Wanci',
                pax: '1 Orang',
                desc: 'Nikmati waktu personal Anda dengan sajian lengkap dan penyajian cepat yang memanjakan lidah.',
                icon: 'fa-user',
                services: [
                    '1 menu utama khas Nusantara',
                    '1 lauk pendamping',
                    'Nasi hangat (putih/uduk/liwet)',
                    '1 minuman tradisional atau teh',
                    'Sambal khas pilihan',
                    'Penyajian cepat khusus personal set',
                    'Complimentary kerupuk atau kudapan kecil'
                ],
                suitableFor: ['Makan sendiri', 'Pekerja', 'Mahasiswa', 'Quick dining'],
                bonus: []
            },
            {
                id: 'sepasang',
                name: 'Paket Sepasang',
                pax: '2 Orang',
                desc: 'Ciptakan momen bersama dengan set hidangan meja spesial.',
                icon: 'fa-user-group',
                services: [
                    '2 menu utama pilihan',
                    '2 lauk pendamping',
                    '1 menu sharing tradisional',
                    'Nasi untuk 2 orang',
                    '2 minuman pilihan',
                    'Desert tradisional mini',
                    'Meja couple setup bernuansa Nusantara',
                    'Free refill sambal & lalapan'
                ],
                suitableFor: ['Pasangan', 'Sahabat', 'Teman kerja', 'Quality time'],
                bonus: []
            },
            {
                id: 'serumpun',
                name: 'Paket Serumpun',
                pax: '4–10 Orang',
                desc: 'Pilihan tepat untuk kebersamaan dengan porsi sharing besar ala rumahan.',
                icon: 'fa-users',
                services: [
                    'Pilihan menu lengkap sharing platter',
                    'Aneka lauk Nusantara dalam porsi besar',
                    'Sayur tradisional pilihan',
                    'Nasi bakul/prasmanan mini',
                    'Minuman teko keluarga',
                    'Dessert tradisional bersama',
                    'Free tambahan sambal & lalapan',
                    'Prioritas meja family area',
                    'Free reservasi meja'
                ],
                suitableFor: ['Keluarga', 'Reuni kecil', 'Makan bersama'],
                bonus: ['Dekorasi sederhana untuk ulang tahun/acara keluarga']
            },
            {
                id: 'kenduri',
                name: 'Paket Kenduri',
                pax: '> 10 Orang',
                desc: 'Jamuan eksklusif grup besar dengan setup prasmanan premium dan pelayanan khusus.',
                icon: 'fa-champagne-glasses',
                services: [
                    'Set hidangan lengkap khas Nusantara',
                    'Konsep prasmanan/hidang meja',
                    'Pilihan menu daerah premium',
                    'Minuman refill bersama',
                    'Dessert tradisional lengkap',
                    'Reserved private/group area',
                    'Pelayanan khusus grup',
                    'Free reservasi & penataan meja acara',
                    'Sound system ringan (opsional)',
                    'Dekorasi sederhana bernuansa tradisional',
                    'Prioritas pemesanan'
                ],
                suitableFor: ['Gathering', 'Arisan', 'Acara kantor'],
                bonus: ['Custom menu sesuai acara']
            }
        ];

        const grid = document.getElementById('packagesGrid');
        
        packagesData.forEach((pkg, index) => {
            const delay = index * 0.1;
            const cardHTML = `
                <div class="package-card" data-id="${pkg.id}" style="animation: fadeInUp 0.6s ease forwards ${delay}s; opacity: 0; transform: translateY(30px);">
                    <div class="pax-badge">${pkg.pax}</div>
                    <i class="fa-solid ${pkg.icon} card-icon"></i>
                    <h3>${pkg.name}</h3>
                    <p>${pkg.desc}</p>
                    <button class="btn-detail">Lihat Detail</button>
                </div>
            `;
            grid.insertAdjacentHTML('beforeend', cardHTML);
        });

        const modal = document.getElementById('packageModal');
        const closeModalBtn = document.getElementById('closeModal');

        document.querySelectorAll('.package-card').forEach(card => {
            card.addEventListener('click', () => {
                const pkg = packagesData.find(p => p.id === card.dataset.id);
                document.getElementById('modalTitle').textContent = pkg.name;
                document.getElementById('modalPax').textContent = `Kapasitas: ${pkg.pax}`;
                document.getElementById('modalServices').innerHTML = pkg.services.map(s => `<li><i class="fa-solid fa-check"></i> ${s}</li>`).join('');
                document.getElementById('modalSuitable').innerHTML = pkg.suitableFor.map(s => `<li><i class="fa-solid fa-star"></i> ${s}</li>`).join('');
                
                if(pkg.bonus.length > 0) {
                    document.getElementById('modalBonusSection').style.display = 'block';
                    document.getElementById('modalBonus').innerHTML = pkg.bonus.map(b => `<li><i class="fa-solid fa-gift"></i> ${b}</li>`).join('');
                } else {
                    document.getElementById('modalBonusSection').style.display = 'none';
                }
                modal.classList.add('active');
                document.body.style.overflow = 'hidden';
            });
        });

        closeModalBtn.addEventListener('click', () => {
            modal.classList.remove('active');
            document.body.style.overflow = 'auto';
        });

        window.onclick = (e) => { if(e.target === modal) { modal.classList.remove('active'); document.body.style.overflow = 'auto'; } };

        const style = document.createElement('style');
        style.innerHTML = `@keyframes fadeInUp { to { opacity: 1; transform: translateY(0); } }`;
        document.head.appendChild(style);
    </script>
</body>
</html>
